      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="52" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3daee9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3daee9" stop-opacity="0"/>
