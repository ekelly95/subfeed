[package]
name = "subfeed_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# A static library that CMake links into the `subfeed` executable.
[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", default-features = false, features = ["qt_gui", "qt_qml"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.4"
dirs = "6"
fastrand = "2"
ring = "0.17"
quick-xml = { version = "0.42", features = ["serialize"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4"
zbus = "5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
