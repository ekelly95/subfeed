# On a version tag (v0.1.2): build subfeed.flatpak from packaging/flatpak and attach it to that
# tag's GitHub release. If the release doesn't exist yet, a draft is made for you to write and
# publish; if it does (gh release create), the file is added to it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    # Flathub's image with the KDE 6.11 runtime and SDK the manifest uses.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      # Actions are pinned to commits; the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the version
        run: ./packaging/check-version.sh "$GITHUB_REF_NAME"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.ekelly95.Subfeed.yml
          bundle: subfeed.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: subfeed-flatpak

  release:
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subfeed-flatpak

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: subfeed.flatpak
          draft: true
          fail_on_unmatched_files: true
